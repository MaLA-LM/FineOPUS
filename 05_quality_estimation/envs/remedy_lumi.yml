# ==================================================================
# Remedy + vLLM dependency reference for LUMI (AMD ROCm)
#
# WARNING: This YAML alone cannot produce a working vLLM+ROCm environment.
# vLLM 0.9.x has no pre-built pip wheels for ROCm (only CUDA wheels).
# PyTorch ROCm and vLLM must come from a ROCm container image.
#
# Use Singularity definition files instead:
#   envs/remedy_lumi_source.def   - default, exact vLLM 0.9.2 from source
#   envs/remedy_lumi_prebuilt.def - fallback, prebuilt vLLM 0.9.1 (non-strict)
#
# Build helper:
#   bash scripts/build_container_lumi.sh source
# ==================================================================
name: remedy_vllm092
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Used directly by Remedy code
  - pandas
  - scipy

  # Remedy-declared deps
  - scikit-learn>=1.6.0
  - matplotlib>=3.10.0

  - pip:
      # Provided by rocm/vllm container base image.
      # DO NOT uncomment in a plain pip/conda environment.
      # - --extra-index-url https://download.pytorch.org/whl/rocm6.3
      # - torch==2.7.0+rocm6.3
      # - torchvision==0.22.0+rocm6.3
      # - torchaudio==2.7.0+rocm6.3
      # - vllm==0.9.2          # CUDA-only wheel on PyPI

      # Installed with --no-deps in the .def file.
      # This avoids pulling the CUDA wheel for vllm==0.9.2.
      # - remedy-mt-eval==0.1.3

      # Pure-Python dependencies (safe to pip-install)
      - transformers<4.54.0
      - datasets>=3.1.0
      - trl>=0.12.0
      - hf-transfer>=0.1.8
      - pyarrow
      - pydantic
      - huggingface_hub>=0.30,<1.0
      - safetensors>=0.4.3